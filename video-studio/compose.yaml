services:
  studio:
    build: .
    ports:
      - "127.0.0.1:4180:4180"
    volumes:
      - studio-data:/data
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4173/api/health', timeout=5); urllib.request.urlopen('http://127.0.0.1:4180/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3
    restart: unless-stopped
volumes:
  studio-data:
