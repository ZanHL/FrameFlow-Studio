[project]
name = "video-studio"
version = "0.1.0"
description = "Local video creation studio with bundled media engine"
requires-python = ">=3.11,<3.13"
dependencies = [
  "moviepy==2.2.1",
  "streamlit==1.66.1",
  "starlette==1.3.1",
  "edge-tts==7.3.1",
  "fastapi==0.136.3",
  "uvicorn==0.32.1",
  "openai==2.24.0",
  "faster-whisper==1.1.0",
  "av<19",
  "toml==0.10.2",
  "imageio-ffmpeg==0.6.0",
  "loguru==0.7.3",
  "dashscope==1.20.14",
  "azure-cognitiveservices-speech==1.41.1",
  "redis==5.2.0",
  "python-multipart==0.0.30",
  "pyyaml==6.0.3",
  "requests==2.33.1",
  "packaging==24.2",
  "socksio==1.0.0",
  "pydub==0.25.1",
  "audioop-lts==0.2.2; python_version >= '3.13'",
  "litellm==1.103.1",
  "google-genai==2.11.0",
  "pyjwt[crypto]>=2.10.1,<3",
  "filelock>=4.2.1,<5",
  "khatt[video]==0.4.0"
]

[dependency-groups]
api = ["fastapi==0.136.3", "uvicorn==0.32.1", "requests==2.33.1"]
dev = ["pytest>=9,<10", "httpx2>=2.16,<3"]

[tool.uv]
package = true
override-dependencies = ["pillow>=13.0.0,<14", "onnxruntime<1.24", "cryptography<47"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
video-studio = "video_studio.cli:main"

[tool.setuptools]
packages = ["video_studio"]
package-dir = {video_studio = "."}
include-package-data = true

[tool.setuptools.package-data]
video_studio = ["static/**/*", "static/*", "docs/*.md", "*.json", "*.html", "studio/**/*.py", "vendor/moneyprinterturbo/**/*", "vendor/moneyprinterturbo/app/_assets/**/*", "vendor/moneyprinterturbo/LICENSE", "vendor/moneyprinterturbo/MANIFEST.json"]
